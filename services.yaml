set_light_mode:
  name: Set Light Mode
  description: Set the mode and settings for a grow light.
  fields:
    light:
      name: Light
      description: Which light (1 or 2)
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 2
    mode:
      name: Mode
      description: Light mode
      required: true
      selector:
        select:
          options:
            - Manual
            - Schedule
            - PPFD
    brightness:
      name: Brightness
      description: Brightness level (0-100%)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    schedule_start:
      name: Schedule Start
      description: "Schedule start time (HH:MM)"
      selector:
        time:
    schedule_end:
      name: Schedule End
      description: "Schedule end time (HH:MM)"
      selector:
        time:
    ppfd_target:
      name: PPFD Target
      description: Target PPFD for PPFD mode
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: "µmol/m²/s"
    fade_minutes:
      name: Fade Time
      description: Sunrise/sunset fade time in minutes
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
    dimming_min:
      name: Dimming Min
      description: Minimum dimming percentage
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    dimming_max:
      name: Dimming Max
      description: Maximum dimming percentage
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_fan_mode:
  name: Set Fan/Blower Mode
  description: Set the mode and settings for a fan or blower.
  fields:
    device:
      name: Device
      description: Which device
      required: true
      selector:
        select:
          options:
            - fan
            - blower
    mode:
      name: Mode
      description: Device mode
      required: true
      selector:
        select:
          options:
            - Manual
            - Schedule
            - Cycle
            - "Environment: Temperature only"
            - "Environment: Humidity only"
            - "Environment: Prioritize temperature"
            - "Environment: Prioritize humidity"
            - "Environment: Temperature & humidity"
    speed:
      name: Speed
      description: Active speed (1-10 for fan, 1-100 for blower)
      selector:
        number:
          min: 1
          max: 100
    standby_speed:
      name: Standby Speed
      description: Standby speed (0=off)
      selector:
        number:
          min: 0
          max: 100
    schedule_start:
      name: Schedule Start
      description: "Schedule start time (HH:MM)"
      selector:
        time:
    schedule_end:
      name: Schedule End
      description: "Schedule end time (HH:MM)"
      selector:
        time:
    cycle_run_minutes:
      name: Cycle Run Time
      description: Cycle on-time in minutes
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    cycle_off_minutes:
      name: Cycle Off Time
      description: Cycle off-time in minutes
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    cycle_times:
      name: Cycle Count
      description: Number of cycles per day
      selector:
        number:
          min: 1
          max: 100

set_humidifier_mode:
  name: Set Humidifier Mode
  description: Set the mode and settings for the humidifier.
  fields:
    mode:
      name: Mode
      description: Humidifier mode
      required: true
      selector:
        select:
          options:
            - Manual
            - Time Slot
            - Cycle
            - Humidity
    schedule_start:
      name: Time Slot Start
      description: "Start time (HH:MM)"
      selector:
        time:
    schedule_end:
      name: Time Slot End
      description: "End time (HH:MM)"
      selector:
        time:
    cycle_run_minutes:
      name: Cycle Run Time
      description: Cycle on-time in minutes
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    cycle_off_minutes:
      name: Cycle Off Time
      description: Cycle off-time in minutes
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    cycle_times:
      name: Cycle Count
      description: Number of cycles per day
      selector:
        number:
          min: 1
          max: 100

create_plan:
  name: Create Planting Plan
  description: Create a new planting plan with environment targets and device settings.
  fields:
    name:
      name: Plan Name
      description: Name for this plan (e.g. Seed, Veg, Flower)
      required: true
      selector:
        text:
    day_cycle_start:
      name: Day Cycle Start
      description: "Light period start time (HH:MM)"
      required: true
      selector:
        time:
    day_cycle_end:
      name: Day Cycle End
      description: "Light period end time (HH:MM)"
      required: true
      selector:
        time:
    temp_day:
      name: Day Temperature Target
      required: true
      selector:
        number:
          min: 10
          max: 40
          unit_of_measurement: "°C"
          step: 0.5
    temp_night:
      name: Night Temperature Target
      required: true
      selector:
        number:
          min: 10
          max: 40
          unit_of_measurement: "°C"
          step: 0.5
    temp_dead_zone:
      name: Temperature Dead Zone
      required: true
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: "°C"
          step: 0.5
    humidity_day:
      name: Day Humidity Target
      required: true
      selector:
        number:
          min: 20
          max: 95
          unit_of_measurement: "%"
    humidity_night:
      name: Night Humidity Target
      required: true
      selector:
        number:
          min: 20
          max: 95
          unit_of_measurement: "%"
    humidity_dead_zone:
      name: Humidity Dead Zone
      required: true
      selector:
        number:
          min: 1
          max: 20
          unit_of_measurement: "%"
    co2_day:
      name: CO2 Day Target
      selector:
        number:
          min: 0
          max: 2000
          unit_of_measurement: ppm
    co2_night:
      name: CO2 Night Target
      selector:
        number:
          min: 0
          max: 2000
          unit_of_measurement: ppm
    co2_dead_zone:
      name: CO2 Dead Zone
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: ppm
    light1_ppfd_target:
      name: Light 1 PPFD Target
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: "µmol/m²/s"
    light1_dimming_min:
      name: Light 1 Dimming Min
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    light1_dimming_max:
      name: Light 1 Dimming Max
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    light1_fade_minutes:
      name: Light 1 Fade Time
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
    start_date:
      name: Start Date
      description: Plan start date
      selector:
        date:
    end_date:
      name: End Date
      description: Plan end date
      selector:
        date:

update_plan:
  name: Update Planting Plan
  description: Modify settings on an existing planting plan.
  fields:
    name:
      name: Plan Name
      description: Name of the plan to update
      required: true
      selector:
        text:

delete_plan:
  name: Delete Planting Plan
  description: Remove a saved planting plan.
  fields:
    name:
      name: Plan Name
      description: Name of the plan to delete
      required: true
      selector:
        text:

activate_plan:
  name: Activate Planting Plan
  description: Push a planting plan to the controller and start it.
  fields:
    name:
      name: Plan Name
      description: Name of the plan to activate
      required: true
      selector:
        text:
    start_date:
      name: Start Date
      description: Override plan start date
      selector:
        date:
    end_date:
      name: End Date
      description: Override plan end date
      selector:
        date:

deactivate_plan:
  name: Deactivate Planting Plan
  description: Stop the currently active planting plan.
